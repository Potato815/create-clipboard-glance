# Java's Windows launcher reads argument files using the native encoding (MS949 here).
# Match it in the Gradle daemon so worker classpaths with Korean paths remain valid.
# Java source compilation is explicitly UTF-8 in build.gradle.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=COMPAT
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
org.gradle.java.installations.auto-download=false

minecraft_version=1.21.1
neo_version=21.1.219
create_version=6.0.10-280
ponder_version=1.0.82
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67

# mod_id is the stable internal identifier (translation and key binding names); mod_name is the display name.
mod_id=create_clipboard_hud
mod_name=Create: Clipboard Glance
mod_version=1.0.0
mod_group_id=dev.clipboardhud
# SPDX identifier. Full text: ../LICENSE (template files keep TEMPLATE_LICENSE.txt, MIT).
mod_license=CC-BY-NC-SA-4.0
