# Build with JDK 17. Java source compilation is explicitly UTF-8 in build.gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.workers.max=4
org.gradle.java.installations.auto-download=false

minecraft_version=1.20.1
# Compile against the Forge version Create 6.0.8 builds with; NeoForge 1.20.1 (47.1.x) is based on it.
# Do not use Forge APIs added after 47.1 so the same JAR also runs on NeoForge 1.20.1.
forge_version=47.1.33
create_version=6.0.8-291
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3
mixin_extras_version=0.4.1

# mod_id is the stable internal identifier (translation and key binding names); mod_name is the display name.
mod_id=create_clipboard_hud
mod_name=Create: Clipboard Glance
mod_version=1.0.0
mod_group_id=dev.clipboardhud
# SPDX identifier. Full text: ../LICENSE (template files keep TEMPLATE_LICENSE.txt, MIT).
mod_license=CC-BY-NC-SA-4.0
